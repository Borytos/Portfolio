<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio horloger interactif de Borys Lucjanek — Étudiant ingénieur en dernière année à l'INP SIGMA Clermont (Spécialité Matériaux Innovants et Durables), spécialisé en sciences des matériaux, mécanique et simulation numérique." />
  <title>Portfolio Horloger — Borys Lucjanek | Ingénieur Matériaux &amp; Mécanique</title>

  <!-- Polices Google Fonts : Plus Jakarta Sans, Playfair Display & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            horology: {
              bg: '#070b14',
              surface: '#0e1625',
              card: '#131e32',
              border: '#20304a',
              gold: '#d4af37',
              goldLight: '#f3e5ab',
              goldDark: '#997a15',
              steel: '#cbd5e1',
              steelMuted: '#94a3b8'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            serif: ['Playfair Display', 'Georgia', 'serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          boxShadow: {
            watch: '0 25px 60px -15px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(212, 175, 55, 0.25)',
            'gold-glow': '0 0 24px rgba(212, 175, 55, 0.35)'
          }
        }
      }
    };
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #070b14;
      background-image:
        radial-gradient(circle at 18% 22%, rgba(212, 175, 55, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 84% 78%, rgba(56, 189, 248, 0.07) 0%, transparent 45%);
      color: #f1f5f9;
      overflow-x: hidden;
    }

    /* Texture guillochée subtile sur le fond du cadran */
    .dial-guilloche {
      background:
        repeating-radial-gradient(
          circle at 50% 50%,
          rgba(212, 175, 55, 0.03) 0px,
          rgba(212, 175, 55, 0.03) 2px,
          transparent 2px,
          transparent 8px
        ),
        radial-gradient(circle at 50% 42%, #17233b 0%, #0b1220 68%, #060a12 100%);
    }

    /* Transition fluide mécanique de l'aiguille des heures */
    #watch-hour-hand {
      transform-origin: 220px 220px;
      transition: transform 0.72s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    /* Balancier mécanique oscillant */
    @keyframes balanceOscillate {
      0%, 100% { transform: rotate(-22deg); }
      50% { transform: rotate(22deg); }
    }

    #balance-wheel {
      transform-origin: 122px 220px;
      animation: balanceOscillate 1.8s ease-in-out infinite;
    }

    /* Jauge circulaire de réserve de marche */
    #power-reserve-arc {
      transition: stroke-dashoffset 0.72s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Stabilité stricte des boutons de navigation (hauteur fixe 46px, sans retour à la ligne) */
    .watch-nav-btn {
      height: 46px;
      min-height: 46px;
      max-height: 46px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    /* Animation d'apparition du contenu de chaque rubrique */
    @keyframes stageFadeSlide {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stage-animate {
      animation: stageFadeSlide 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Index horaires cliquables sur le cadran */
    .hour-marker-group {
      cursor: pointer;
    }
    .hour-marker-group:hover .hour-numeral,
    .hour-marker-group:focus-visible .hour-numeral {
      fill: #f3e5ab;
    }
    .hour-marker-group:hover .hour-hit-ring {
      stroke: rgba(212, 175, 55, 0.55);
    }

    /* Barre de défilement discrète */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #070b14;
    }
    ::-webkit-scrollbar-thumb {
      background: #20304a;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #d4af37;
    }

    @media print {
      body {
        background: #ffffff !important;
        color: #0f172a !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-horology-gold selection:text-horology-bg">

  <!-- =====================================================================
       EN-TÊTE MINIMALISTE & ACCÈS RAPIDES
       ===================================================================== -->
  <header class="w-full border-b border-horology-border/80 bg-horology-bg/90 backdrop-blur-md sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
      <!-- Identité & Emblème -->
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-full border-2 border-horology-gold bg-horology-surface flex items-center justify-center shrink-0 shadow-gold-glow">
          <span class="font-serif font-bold text-horology-gold text-base tracking-wider">BL</span>
        </div>
        <div class="truncate">
          <p class="text-sm sm:text-base font-bold text-white tracking-tight truncate">Borys Lucjanek</p>
          <p class="text-[11px] sm:text-xs font-mono text-horology-steelMuted truncate">
            INP SIGMA Clermont • Matériaux Innovants &amp; Durables
          </p>
        </div>
      </div>

      <!-- Accès directs : Accueil (00h) & Contact (11h) -->
      <div class="flex items-center gap-2">
        <button
          type="button"
          data-goto-step="0"
          class="step-jump-btn px-3 py-2 rounded-xl text-xs font-mono font-semibold bg-horology-surface border border-horology-border text-horology-steel hover:border-horology-gold hover:text-white transition-colors"
        >
          00h
        </button>
        <button
          type="button"
          data-goto-step="11"
          class="step-jump-btn px-3.5 py-2 rounded-xl text-xs font-mono font-semibold bg-horology-gold/15 border border-horology-gold/60 text-horology-goldLight hover:bg-horology-gold hover:text-horology-bg transition-colors"
        >
          11h • Contact
        </button>
      </div>
    </div>
  </header>

  <!-- =====================================================================
       SCÈNE PRINCIPALE : CADRAN HORLOGER À GAUCHE + FICHE DÉTAILLÉE À DROITE
       ===================================================================== -->
  <main id="interactive-stage-wrapper" class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8 flex flex-col justify-center">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">

      <!-- ===================================================================
           COLONNE GAUCHE : CADRAN DE MONTRE INTERACTIF (00H À 11H, BOUCLE 12H)
           =================================================================== -->
      <section aria-label="Cadran horloger de navigation" class="lg:col-span-5 flex flex-col items-center lg:sticky lg:top-24">
        
        <!-- Boîtier circulaire de la montre -->
        <div class="relative w-full max-w-[350px] sm:max-w-[390px] lg:max-w-[400px] aspect-square rounded-full p-2.5 sm:p-3 bg-gradient-to-br from-slate-700 via-slate-900 to-slate-950 shadow-watch border border-horology-gold/35 flex items-center justify-center">
          
          <!-- Couronne de remontoir décorative à droite -->
          <div aria-hidden="true" class="hidden sm:flex flex-col justify-between items-center absolute -right-3.5 top-1/2 -translate-y-1/2 w-3.5 h-14 rounded-r-lg bg-gradient-to-b from-horology-goldLight via-horology-gold to-horology-goldDark border border-amber-200/40 shadow-lg py-1.5">
            <span class="w-full h-[1.5px] bg-amber-950/60"></span>
            <span class="w-full h-[1.5px] bg-amber-950/60"></span>
            <span class="w-full h-[1.5px] bg-amber-950/60"></span>
            <span class="w-full h-[1.5px] bg-amber-950/60"></span>
            <span class="w-full h-[1.5px] bg-amber-950/60"></span>
          </div>

          <!-- Cadran SVG Haute Horlogerie (440x440) -->
          <svg
            id="watch-dial-svg"
            viewBox="0 0 440 440"
            class="w-full h-full rounded-full dial-guilloche select-none"
            role="img"
            aria-label="Cadran de montre interactif comportant 11 rubriques de 00h à 11h"
          >
            <defs>
              <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f3e5ab" />
                <stop offset="45%" stop-color="#d4af37" />
                <stop offset="100%" stop-color="#8a6b14" />
              </linearGradient>

              <linearGradient id="handFacetLeft" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#fffbeb" />
                <stop offset="100%" stop-color="#d4af37" />
              </linearGradient>

              <linearGradient id="handFacetRight" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#b88e1e" />
                <stop offset="100%" stop-color="#6e5209" />
              </linearGradient>

              <filter id="handShadow" x="-25%" y="-25%" width="150%" height="150%">
                <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.7" />
              </filter>

              <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="2.5" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <!-- 1. Lunette extérieure -->
            <circle cx="220" cy="220" r="214" fill="none" stroke="url(#goldBevel)" stroke-width="3.5" />
            <circle cx="220" cy="220" r="205" fill="none" stroke="#1e293b" stroke-width="2" />

            <!-- 2. Anneau de réserve de marche (0% à 100%) -->
            <circle cx="220" cy="220" r="186" fill="none" stroke="rgba(148, 163, 184, 0.14)" stroke-width="6" />
            <circle
              id="power-reserve-arc"
              cx="220"
              cy="220"
              r="186"
              fill="none"
              stroke="url(#goldBevel)"
              stroke-width="6"
              stroke-linecap="round"
              stroke-dasharray="1168.67"
              stroke-dashoffset="1168.67"
              transform="rotate(-90 220 220)"
            />

            <!-- 3. Chemin de fer intérieur -->
            <circle cx="220" cy="220" r="179" fill="none" stroke="rgba(212, 175, 55, 0.35)" stroke-width="1" />
            <circle cx="220" cy="220" r="168" fill="none" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />

            <!-- 4. Sous-cadran balancier mécanique à 9h -->
            <g opacity="0.65">
              <circle cx="122" cy="220" r="32" fill="#060a12" stroke="rgba(212, 175, 55, 0.35)" stroke-width="1.2" />
              <g id="balance-wheel">
                <circle cx="122" cy="220" r="22" fill="none" stroke="#d4af37" stroke-width="1.8" stroke-dasharray="6 3" />
                <line x1="100" y1="220" x2="144" y2="220" stroke="#d4af37" stroke-width="1.2" />
                <line x1="122" y1="198" x2="122" y2="242" stroke="#d4af37" stroke-width="1.2" />
              </g>
              <circle cx="122" cy="220" r="4.5" fill="#e11d48" />
            </g>

            <!-- 5. Graduations des 60 minutes (générées en JS) -->
            <g id="minute-ticks-layer"></g>

            <!-- 6. Index horaires 1 à 12 cliquables (générés en JS) -->
            <g id="hour-markers-layer"></g>

            <!-- 7. Signature horlogère à 12h -->
            <text x="220" y="114" text-anchor="middle" fill="#f3e5ab" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="13" letter-spacing="2.5">
              BORYS LUCJANEK
            </text>
            <text x="220" y="130" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-weight="500" font-size="8.5" letter-spacing="1.6">
              SIGMA CLERMONT • MID
            </text>

            <!-- 8. Guichet de complication à 6h affichant uniquement l'heure courante et le titre -->
            <g transform="translate(220, 294)">
              <rect x="-68" y="-22" width="136" height="44" rx="8" fill="#060a12" stroke="url(#goldBevel)" stroke-width="1.5" />
              <text id="dial-aperture-step" x="0" y="-4" text-anchor="middle" fill="#d4af37" font-family="JetBrains Mono, monospace" font-weight="700" font-size="9.5" letter-spacing="1.1">
                00 / 11H • 0%
              </text>
              <text id="dial-aperture-label" x="0" y="12" text-anchor="middle" fill="#f1f5f9" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="9.2" letter-spacing="0.4">
                PRÉSENTATION
              </text>
            </g>

            <!-- 9. Aiguille Dauphine à facettes (tourne par pas horaires) -->
            <g id="watch-hour-hand" filter="url(#handShadow)">
              <polygon points="220,256 213,220 220,66" fill="url(#handFacetLeft)" />
              <polygon points="220,256 227,220 220,66" fill="url(#handFacetRight)" />
              <line x1="220" y1="158" x2="220" y2="84" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />
            </g>

            <!-- 10. Chapeau central de l'axe des aiguilles -->
            <circle cx="220" cy="220" r="13" fill="url(#goldBevel)" stroke="#070b14" stroke-width="2" />
            <circle cx="220" cy="220" r="5" fill="#070b14" />
            <circle cx="220" cy="220" r="2" fill="#f3e5ab" />
          </svg>
        </div>

        <!-- =================================================================
             INDICATEUR D'HEURE & RÉSERVE DE MARCHE (%) + BOUTONS FIXES 46PX
             ================================================================= -->
        <div class="mt-4 w-full max-w-[400px] space-y-2.5">
          <!-- Barre de statut horloger : Heure courante & Réserve de marche en % -->
          <div class="flex items-center justify-between px-4 py-2 rounded-xl bg-horology-surface border border-horology-border font-mono text-xs">
            <span class="text-horology-steelMuted">
              Position : <strong id="controls-step-badge" class="text-horology-gold font-bold">00 / 11h</strong>
            </span>
            <span class="text-horology-steelMuted">
              Réserve : <strong id="controls-reserve-badge" class="text-horology-goldLight font-bold">0%</strong>
            </span>
          </div>

          <!-- Grille 2 colonnes égales (1fr / 1fr) à hauteur fixe (46px) -->
          <div class="grid grid-cols-2 gap-3 w-full">
            <button
              id="btn-prev-hour"
              type="button"
              aria-label="Heure précédente"
              class="watch-nav-btn w-full px-3 rounded-2xl bg-horology-surface hover:bg-horology-card disabled:opacity-40 disabled:cursor-not-allowed border border-horology-border hover:border-horology-gold/60 text-horology-steel hover:text-white font-semibold text-xs sm:text-sm inline-flex items-center justify-center transition-colors active:scale-95"
            >
              ← Précédent
            </button>

            <button
              id="btn-next-hour"
              type="button"
              aria-label="Heure suivante"
              class="watch-nav-btn w-full px-3 rounded-2xl bg-gradient-to-r from-horology-gold to-amber-500 hover:from-horology-goldLight hover:to-horology-gold text-horology-bg font-bold text-xs sm:text-sm inline-flex items-center justify-center shadow-gold-glow transition-all active:scale-95"
            >
              <span id="btn-next-label">Démarrer · 01h →</span>
            </button>
          </div>
        </div>

        <!-- Barre de repères rapides (00 à 11) -->
        <div class="mt-3.5 w-full max-w-[400px] flex flex-col items-center gap-1.5">
          <div id="mini-hours-bar" class="flex items-center justify-center flex-wrap gap-1.5" aria-label="Accès rapide aux heures">
            <!-- Généré dynamiquement en JS (00 à 11) -->
          </div>
          <p class="text-[11px] font-mono text-horology-steelMuted text-center">
            Cliquez sur une heure du cadran, utilisez les flèches ← → ou glissez sur mobile
          </p>
        </div>
      </section>

      <!-- ===================================================================
           COLONNE DROITE : PANNEAU DYNAMIQUE DE LA RUBRIQUE ACTIVE
           =================================================================== -->
      <section aria-live="polite" class="lg:col-span-7 w-full">
        <article
          id="stage-content-card"
          class="w-full rounded-3xl bg-horology-surface/95 border border-horology-border/90 p-5 sm:p-7 lg:p-8 shadow-watch backdrop-blur-sm"
        >
          <div id="stage-dynamic-body"></div>
        </article>
      </section>

    </div>
  </main>

  <!-- =====================================================================
       VISIONNEUSE LIGHTBOX PLEIN ÉCRAN POUR LES GALERIES PROJETS (03H – 09H)
       ===================================================================== -->
  <div
    id="gallery-lightbox"
    class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-md flex items-center justify-center p-4 sm:p-6"
    role="dialog"
    aria-modal="true"
    aria-labelledby="lightbox-caption"
  >
    <div class="relative w-full max-w-4xl rounded-3xl bg-horology-surface border border-horology-gold/50 shadow-watch overflow-hidden flex flex-col">
      <!-- Barre supérieure Lightbox -->
      <div class="flex items-center justify-between px-4 sm:px-6 py-3 border-b border-horology-border bg-horology-bg/90">
        <span id="lightbox-counter" class="font-mono text-xs text-horology-gold font-bold">1 / 3</span>
        <button
          id="lightbox-close-btn"
          type="button"
          class="px-3 py-1.5 rounded-xl bg-horology-card hover:bg-horology-gold hover:text-horology-bg text-xs font-mono font-semibold text-white transition-colors"
        >
          Fermer ✕
        </button>
      </div>

      <!-- Zone d'affichage grand format -->
      <div class="relative w-full aspect-video bg-horology-bg flex items-center justify-center overflow-hidden">
        <img id="lightbox-img" src="" alt="" class="w-full h-full object-contain hidden" />
        <div id="lightbox-svg-holder" class="w-full h-full flex items-center justify-center"></div>

        <!-- Boutons précédent / suivant dans la Lightbox -->
        <button
          id="lightbox-prev-btn"
          type="button"
          aria-label="Image précédente"
          class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-horology-bg/85 hover:bg-horology-gold text-white hover:text-horology-bg border border-horology-gold/40 flex items-center justify-center font-bold transition-colors"
        >
          ←
        </button>
        <button
          id="lightbox-next-btn"
          type="button"
          aria-label="Image suivante"
          class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-horology-bg/85 hover:bg-horology-gold text-white hover:text-horology-bg border border-horology-gold/40 flex items-center justify-center font-bold transition-colors"
        >
          →
        </button>
      </div>

      <!-- Légende détaillée -->
      <div class="px-4 sm:px-6 py-3.5 bg-horology-surface border-t border-horology-border">
        <p id="lightbox-caption" class="text-xs sm:text-sm text-slate-200 font-medium"></p>
      </div>
    </div>
  </div>

  <!-- =====================================================================
       NOTIFICATION TOAST NON BLOQUANTE (COPIE PRESSE-PAPIERS / APERÇU LOCAL)
       ===================================================================== -->
  <div
    id="toast-notification"
    role="status"
    aria-live="polite"
    class="fixed bottom-5 right-5 z-50 pointer-events-none opacity-0 translate-y-3 transition-all duration-300 max-w-sm rounded-2xl bg-horology-card border border-horology-gold/60 px-4 py-3 shadow-watch text-xs sm:text-sm text-white flex items-center gap-2.5"
  >
    <span class="w-2.5 h-2.5 rounded-full bg-horology-gold shrink-0"></span>
    <span id="toast-message">Action effectuée</span>
  </div>

  <!-- =====================================================================
       PIED DE PAGE
       ===================================================================== -->
  <footer class="w-full border-t border-horology-border/60 py-4 text-center text-xs font-mono text-horology-steelMuted no-print">
    <span>© <span id="footer-year"></span> Borys Lucjanek — Portfolio de compétences • INP SIGMA Clermont</span>
  </footer>

  <!-- =====================================================================
       LOGIQUE INTERACTIVE : CADRAN HORLOGER, GALERIES & 11 RUBRIQUES + CONTACT
       ===================================================================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const footerYearEl = document.getElementById('footer-year');
      if (footerYearEl) footerYearEl.textContent = new Date().getFullYear();

      // Stockage en mémoire des aperçus locaux de photos
      const localImageOverrides = {};

      // =====================================================================
      // 1. SCHÉMAS TECHNIQUES SVG BLUEPRINT POUR LES GALERIES (03H À 09H)
      // =====================================================================
      const BLUEPRINT_SVGS = {
        sigma_1: `
          <svg viewBox="0 0 640 360" class="w-full h-full" preserveAspectRatio="xMidYMid slice">
            <rect width="640" height="360" fill="#070b14"/>
            <g stroke="#1e293b" stroke-width="1"><path d="M0 72H640M0 144H640M0 216H640M0 288H640M128 0V360M256 0V360M384 0V360M512 0V360"/></g>
            <g transform="translate(115, 78)">
              <rect x="0" y="75" width="410" height="125" rx="8" fill="#0e1625" stroke="#d4af37" stroke-width="2"/>
              <rect x="28" y="38" width="165" height="162" rx="6" fill="#131e32" stroke="#38bdf8" stroke-width="1.8"/>
              <g stroke="#d4af37" stroke-width="1.2" opacity="0.75">
                <line x1="48" y1="62" x2="173" y2="62"/><line x1="48" y1="88" x2="173" y2="88"/>
                <line x1="48" y1="114" x2="173" y2="114"/><line x1="48" y1="140" x2="173" y2="140"/>
                <line x1="215" y1="102" x2="385" y2="102"/><line x1="215" y1="130" x2="385" y2="130"/>
                <line x1="215" y1="158" x2="385" y2="158"/>
              </g>
              <text x="205" y="22" text-anchor="middle" fill="#f3e5ab" font-family="Playfair Display, serif" font-size="16" font-weight="700" letter-spacing="1.5">INP SIGMA CLERMONT • CAMPUS DES CÉZEAUX</text>
              <text x="205" y="224" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10.5">Génie Mécanique &amp; Matériaux Innovants et Durables (MID)</text>
            </g>
          </svg>`,
        safran_1: `

        probe.onload = () => {
          lightboxImg.src = resolvedSrc;
          lightboxImg.alt = item.caption;
          lightboxImg.classList.remove('hidden');
          lightboxSvgHolder.classList.add('hidden');
        };
        probe.src = resolvedSrc;
      }

      function openLightbox(step, index) {
        lightboxState = { open: true, step, index };
        updateLightboxDisplay();
        lightboxModal.classList.remove('hidden');
      }

      function closeLightbox() {
        lightboxState.open = false;
        lightboxModal.classList.add('hidden');
      }

      if (lightboxCloseBtn) {
        lightboxCloseBtn.addEventListener('click', closeLightbox);
      }

      if (lightboxModal) {
        lightboxModal.addEventListener('click', (e) => {
          if (e.target === lightboxModal) closeLightbox();
        });
      }

      if (lightboxPrevBtn) {
        lightboxPrevBtn.addEventListener('click', () => {
          const gallery = GALLERIES_BY_STEP[lightboxState.step];
          if (!gallery) return;
          lightboxState.index = (lightboxState.index - 1 + gallery.items.length) % gallery.items.length;
          updateLightboxDisplay();
        });
      }

      if (lightboxNextBtn) {
        lightboxNextBtn.addEventListener('click', () => {
          const gallery = GALLERIES_BY_STEP[lightboxState.step];
          if (!gallery) return;
          lightboxState.index = (lightboxState.index + 1) % gallery.items.length;
          updateLightboxDisplay();
        });
      }

      // =====================================================================
      // 7. GESTION D'ÉTAT, TOAST, COPIE PRESSE-PAPIERS & RENDERING
      // =====================================================================
      let currentStep = 0;
      let cumulativeHandSteps = 0;

      const watchHourHand = document.getElementById('watch-hour-hand');
      const powerReserveArc = document.getElementById('power-reserve-arc');
      const dialApertureStep = document.getElementById('dial-aperture-step');
      const dialApertureLabel = document.getElementById('dial-aperture-label');
      const controlsStepBadge = document.getElementById('controls-step-badge');
      const controlsReserveBadge = document.getElementById('controls-reserve-badge');
      const btnPrevHour = document.getElementById('btn-prev-hour');
      const btnNextHour = document.getElementById('btn-next-hour');
      const btnNextLabel = document.getElementById('btn-next-label');
      const stageContentCard = document.getElementById('stage-content-card');
      const stageDynamicBody = document.getElementById('stage-dynamic-body');
      const toastEl = document.getElementById('toast-notification');
      const toastMsgEl = document.getElementById('toast-message');

      let toastTimer = null;

      function showToast(message) {
        if (!toastEl || !toastMsgEl) return;
        toastMsgEl.textContent = message;
        toastEl.classList.remove('opacity-0', 'translate-y-3');
        toastEl.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.classList.add('opacity-0', 'translate-y-3');
          toastEl.classList.remove('opacity-100', 'translate-y-0');
        }, 3200);
      }

      function copyToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(() => {
            showToast(`Copié : ${text}`);
          }).catch(() => {
            fallbackCopyText(text);
          });
        } else {
          fallbackCopyText(text);
        }
      }

      function fallbackCopyText(text) {
        const tempInput = document.createElement('textarea');
        tempInput.value = text;
        tempInput.style.position = 'fixed';
        tempInput.style.left = '-9999px';
        document.body.appendChild(tempInput);
        tempInput.select();
        try {
          document.execCommand('copy');
          showToast(`Copié : ${text}`);
        } catch (err) {
          showToast(`Adresse : ${text}`);
        }
        document.body.removeChild(tempInput);
      }

      function bindDynamicStageEvents() {
        stageDynamicBody.querySelectorAll('.step-jump-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const target = parseInt(btn.getAttribute('data-goto-step'), 10);
            const forceClockwise = btn.getAttribute('data-clockwise-loop') === 'true';
            if (!Number.isNaN(target)) {
              goToStep(target, true, forceClockwise ? 'clockwise' : 'auto');
            }
          });
        });

        stageDynamicBody.querySelectorAll('.copy-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const text = btn.getAttribute('data-copy-text');
            if (text) copyToClipboard(text);
          });
        });

        stageDynamicBody.querySelectorAll('.doc-link').forEach((link) => {
          link.addEventListener('click', async (e) => {
            const href = link.getAttribute('href');
            const label = link.getAttribute('data-doc-label') || href;
            try {
              const response = await fetch(href, { method: 'HEAD' });
              if (!response.ok) {
                e.preventDefault();
                showToast(`Placez "${label}" dans le dossier assets/ sur GitHub.`);
              }
            } catch (err) {
              // Navigation directe conservée en local (file://)
            }
          });
        });

        // Changement de vignette active dans les galeries (03h à 09h)
        stageDynamicBody.querySelectorAll('.gallery-thumb-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const step = parseInt(btn.getAttribute('data-gallery-step'), 10);
            const idx = parseInt(btn.getAttribute('data-gallery-index'), 10);
            if (!Number.isNaN(step) && !Number.isNaN(idx)) {
              galleryActiveSlide[step] = idx;
              goToStep(currentStep, false);
            }
          });
        });

        // Ouverture de la visionneuse Lightbox
        stageDynamicBody.querySelectorAll('.gallery-open-lightbox-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const step = parseInt(btn.getAttribute('data-lightbox-step'), 10);
            const idx = parseInt(btn.getAttribute('data-lightbox-index'), 10);
            if (!Number.isNaN(step) && !Number.isNaN(idx)) {
              openLightbox(step, idx);
            }
          });
        });

        // Prévisualisation immédiate d'une photo locale choisie dans une galerie
        stageDynamicBody.querySelectorAll('.gallery-local-input').forEach((input) => {
          input.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            const targetSrc = input.getAttribute('data-target-src');
            if (file && targetSrc) {
              const objectUrl = URL.createObjectURL(file);
              localImageOverrides[targetSrc] = objectUrl;
              showToast(`Aperçu chargé pour ${targetSrc}`);
              goToStep(currentStep, false);
            }
          });
        });
      }

      // Fonction centrale de navigation entre les heures (00h à 11h, retour 12h = 00h)
      function goToStep(nextStep, animateCard = true, direction = 'auto') {
        const clampedStep = Math.max(0, Math.min(11, nextStep));
        const prevStep = currentStep;
        currentStep = clampedStep;
        const data = PORTFOLIO_STEPS[currentStep];

        // Calcul de la rotation horaire fluide sans saut arrière lors du passage 11h -> 12h (00h)
        if (direction === 'clockwise') {
          let forwardDelta = (currentStep - prevStep + 12) % 12;
          if (forwardDelta === 0) forwardDelta = 12;
          cumulativeHandSteps += forwardDelta;
        } else if (direction === 'counterclockwise') {
          let backwardDelta = (prevStep - currentStep + 12) % 12;
          if (backwardDelta === 0) backwardDelta = 12;
          cumulativeHandSteps -= backwardDelta;
        } else {
          let delta = currentStep - prevStep;
          if (delta > 6) delta -= 12;
          if (delta < -6) delta += 12;
          cumulativeHandSteps += delta;
        }

        const handTurnValue = cumulativeHandSteps * 30;
        const reservePercent = Math.round((currentStep / 11) * 100);

        // 1. Positionnement de l'aiguille des heures
        if (watchHourHand) {
          watchHourHand.style.transform = `rotate(${handTurnValue}deg)`;
        }

        // 2. Remplissage de l'arc de réserve de marche (0% à 100%)
        if (powerReserveArc) {
          const circumference = 1168.67;
          const offset = circumference * (1 - currentStep / 11);
          powerReserveArc.style.strokeDashoffset = offset.toFixed(2);
        }

        // 3. Guichet de complication sur le cadran (uniquement heures et %)
        if (dialApertureStep && dialApertureLabel) {
          const stepStr = currentStep < 10 ? `0${currentStep}` : `${currentStep}`;
          dialApertureStep.textContent = `${stepStr} / 11H • ${reservePercent}%`;
          dialApertureLabel.textContent = data.shortTitle;
        }

        // 4. Illumination dorée de l'index actif sur le cadran (12 correspond à 00h)
        for (let h = 1; h <= 12; h++) {
          const marker = markerElements[h];
          if (!marker) continue;
          const isActive = (h === 12 && currentStep === 0) || currentStep === h;
          marker.activeHalo.setAttribute('opacity', isActive ? '1' : '0');
          marker.text.setAttribute('fill', isActive ? '#f3e5ab' : '#cbd5e1');
          if (isActive) {
            marker.text.setAttribute('filter', 'url(#goldGlow)');
          } else {
            marker.text.removeAttribute('filter');
          }
        }

        // 5. Mise à jour des badges et boutons fixes (hauteur 46px, sans retour à la ligne)
        if (btnPrevHour) {
          btnPrevHour.disabled = currentStep === 0;
        }

        const formattedStep = currentStep < 10 ? `0${currentStep}` : `${currentStep}`;
        if (controlsStepBadge) {
          controlsStepBadge.textContent = `${formattedStep} / 11h`;
        }
        if (controlsReserveBadge) {
          controlsReserveBadge.textContent = `${reservePercent}%`;
        }

        if (btnNextLabel) {
          if (currentStep === 0) {
            btnNextLabel.textContent = 'Démarrer · 01h →';
          } else if (currentStep < 11) {
            const nextH = currentStep + 1;
            const nextFormatted = nextH < 10 ? `0${nextH}` : `${nextH}`;
            btnNextLabel.textContent = `Suivant · ${nextFormatted}h →`;
          } else {
            btnNextLabel.textContent = 'Suivant · 12h →';
          }
        }

        // 6. Barre de repères rapides (00 à 11)
        for (let s = 0; s <= 11; s++) {
          const pill = miniPillButtons[s];
          if (!pill) continue;
          const isCurrent = s === currentStep;
          const isVisited = s > 0 && s < currentStep;

          pill.className = isCurrent
            ? 'w-7 h-7 rounded-lg font-mono text-[11px] font-bold border transition-all bg-horology-gold border-horology-gold text-horology-bg shadow-gold-glow scale-105'
            : isVisited
            ? 'w-7 h-7 rounded-lg font-mono text-[11px] font-semibold border transition-all bg-horology-card border-horology-gold/40 text-horology-goldLight hover:border-horology-gold'
            : 'w-7 h-7 rounded-lg font-mono text-[11px] font-semibold border transition-all bg-horology-surface border-horology-border text-horology-steelMuted hover:border-horology-gold hover:text-white';
        }

        // 7. Injection du contenu de la rubrique active
        if (stageDynamicBody && stageContentCard) {
          if (animateCard) {
            stageContentCard.classList.remove('stage-animate');
            void stageContentCard.offsetWidth;
            stageContentCard.classList.add('stage-animate');
          }

          stageDynamicBody.innerHTML = `
            <div class="mb-5 pb-4 border-b border-horology-border/80">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-1.5">
                <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-horology-gold/15 border border-horology-gold/40 font-mono text-xs font-semibold text-horology-gold">
                  <span>${data.kicker}</span>
                </span>
                <span class="font-mono text-xs text-horology-steelMuted">Réserve : ${reservePercent}%</span>
              </div>
              <h2 class="text-xl sm:text-2xl lg:text-3xl font-extrabold text-white tracking-tight mt-2">
                ${data.title}
              </h2>
              <p class="text-xs sm:text-sm text-horology-steelMuted mt-1 leading-relaxed">
                ${data.subtitle}
              </p>
            </div>
            ${data.render()}
          `;

          bindDynamicStageEvents();
        }
      }

      // =====================================================================
      // 8. ÉCOUTEURS D'ÉVÉNEMENTS (BOUTONS, EN-TÊTE, CLAVIER & SWIPE TACTILE)
      // =====================================================================
      if (btnPrevHour) {
        btnPrevHour.addEventListener('click', () => {
          if (currentStep > 0) goToStep(currentStep - 1, true, 'counterclockwise');
        });
      }

      if (btnNextHour) {
        btnNextHour.addEventListener('click', () => {
          if (currentStep < 11) {
            goToStep(currentStep + 1, true, 'clockwise');
          } else {
            goToStep(0, true, 'clockwise');
          }
        });
      }

      document.querySelectorAll('header .step-jump-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const target = parseInt(btn.getAttribute('data-goto-step'), 10);
          if (!Number.isNaN(target)) goToStep(target);
        });
      });

      document.addEventListener('keydown', (e) => {
        if (lightboxState.open) {
          if (e.key === 'Escape') {
            e.preventDefault();
            closeLightbox();
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            lightboxNextBtn.click();
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            lightboxPrevBtn.click();
          }
          return;
        }

        if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          if (currentStep < 11) {
            goToStep(currentStep + 1, true, 'clockwise');
          } else {
            goToStep(0, true, 'clockwise');
          }
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          if (currentStep > 0) goToStep(currentStep - 1, true, 'counterclockwise');
        }
      });

      const stageWrapper = document.getElementById('interactive-stage-wrapper');
      let touchStartX = 0;
      let touchStartY = 0;

      if (stageWrapper) {
        stageWrapper.addEventListener('touchstart', (e) => {
          if (e.changedTouches && e.changedTouches.length > 0) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
          }
        }, { passive: true });

        stageWrapper.addEventListener('touchend', (e) => {
          if (!e.changedTouches || e.changedTouches.length === 0) return;
          const deltaX = e.changedTouches[0].screenX - touchStartX;
          const deltaY = e.changedTouches[0].screenY - touchStartY;

          if (Math.abs(deltaX) > 55 && Math.abs(deltaX) > Math.abs(deltaY) * 1.4) {
            if (deltaX < 0) {
              if (currentStep < 11) {
                goToStep(currentStep + 1, true, 'clockwise');
              } else {
                goToStep(0, true, 'clockwise');
              }
            } else if (deltaX > 0 && currentStep > 0) {
              goToStep(currentStep - 1, true, 'counterclockwise');
            }
          }
        }, { passive: true });
      }

      // Affichage initial à 00h (Index 12)
      goToStep(0);
    });
  </script>
</body>
